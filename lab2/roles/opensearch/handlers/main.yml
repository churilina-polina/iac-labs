---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Если сервис только что запущен этим же прогоном, он уже читает новую
# конфигурацию, и второй перезапуск ничего не даёт.
- name: Restart OpenSearch
  ansible.builtin.systemd_service:
    name: opensearch
    state: restarted
  when: opensearch_service_start is not changed

- name: Restart OpenSearch Dashboards
  ansible.builtin.systemd_service:
    name: opensearch-dashboards
    state: restarted
  when: opensearch_dashboards_service_start is not changed
