---
- name: Install dependencies
  ansible.builtin.apt:
    name: "{{ opensearch_dependencies }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install OpenSearch repository signing key
  ansible.builtin.copy:
    src: opensearch-release.asc
    dest: "{{ opensearch_keyring_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Add OpenSearch and Dashboards apt repositories
  ansible.builtin.template:
    src: opensearch.sources.j2
    dest: /etc/apt/sources.list.d/opensearch.sources
    owner: root
    group: root
    mode: "0644"
  notify: Update apt cache

# пакеты ставятся следующими задачами, кэш должен быть свежим уже сейчас
- name: Refresh apt cache if repositories changed
  ansible.builtin.meta: flush_handlers
