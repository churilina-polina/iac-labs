---
- name: Destroy Lima VM
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    vm_name: "{{ molecule_yml.platforms[0].name }}"
  tasks:
    - name: Get existing Lima VMs
      ansible.builtin.command: limactl list --format '{{ "{{" }}.Name{{ "}}" }}'
      register: opensearch_lima_vms
      changed_when: false

    - name: Delete VM
      ansible.builtin.command: limactl delete --force {{ vm_name }}
      when: vm_name in opensearch_lima_vms.stdout_lines
      changed_when: true

    - name: Reset instance config
      ansible.builtin.copy:
        content: |
          # Molecule managed
          []
        dest: "{{ molecule_instance_config }}"
        mode: "0600"
