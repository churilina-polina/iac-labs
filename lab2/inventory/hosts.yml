---
# Локальная VM в Lima, её создаёт Molecule (molecule/default/create.yml).
# Порт SSH меняется при каждом старте VM, поэтому подключаемся через ssh-конфиг Lima.
all:
  children:
    opensearch:
      hosts:
        opensearch-lab2:
          ansible_host: lima-opensearch-lab2
          ansible_ssh_common_args: "-F {{ lookup('ansible.builtin.env', 'HOME') }}/.lima/opensearch-lab2/ssh.config"
