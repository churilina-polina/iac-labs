---
- name: Install OpenSearch Dashboards {{ opensearch_dashboards_version }}
  ansible.builtin.apt:
    name: "{{ opensearch_dashboards_package }}={{ opensearch_dashboards_version }}"
    state: present
    allow_downgrade: true
    allow_change_held_packages: true
  notify: Restart OpenSearch Dashboards

- name: Hold Dashboards package version
  ansible.builtin.dpkg_selections:
    name: "{{ opensearch_dashboards_package }}"
    selection: hold

# Плагин безопасности Dashboards не стартует, если security в OpenSearch выключен.
- name: Remove securityDashboards plugin when security is disabled
  ansible.builtin.command:
    cmd: "{{ opensearch_dashboards_home }}/bin/opensearch-dashboards-plugin remove securityDashboards --allow-root"
    removes: "{{ opensearch_dashboards_home }}/plugins/securityDashboards"
  when: not opensearch_security_enabled
  notify: Restart OpenSearch Dashboards

- name: Render opensearch_dashboards.yml
  ansible.builtin.template:
    src: opensearch_dashboards.yml.j2
    dest: "{{ opensearch_dashboards_conf_dir }}/opensearch_dashboards.yml"
    owner: root
    group: "{{ opensearch_dashboards_user }}"
    mode: "0640"
  notify: Restart OpenSearch Dashboards

- name: Enable and start Dashboards
  ansible.builtin.systemd_service:
    name: opensearch-dashboards
    enabled: true
    state: started
  register: opensearch_dashboards_service_start
