---
- name: Install OpenSearch {{ opensearch_version }}
  ansible.builtin.apt:
    name: "{{ opensearch_package }}={{ opensearch_version }}"
    state: present
    allow_downgrade: true
    # пакет стоит на hold, смена версии возможна только явно через эту переменную
    allow_change_held_packages: true
  # postinst пакета создаёт демо-сертификаты и пароль admin из окружения,
  # а с 3.7 умеет пропускать этот шаг при выключенной безопасности
  environment:
    OPENSEARCH_INITIAL_ADMIN_PASSWORD: "{{ opensearch_admin_password if opensearch_security_enabled else '' }}"
    DISABLE_INSTALL_DEMO_CONFIG: "{{ (not opensearch_security_enabled) | string | lower }}"
    DISABLE_SECURITY_PLUGIN: "{{ (not opensearch_security_enabled) | string | lower }}"
  notify: Restart OpenSearch

- name: Hold OpenSearch package version
  ansible.builtin.dpkg_selections:
    name: "{{ opensearch_package }}"
    selection: hold

- name: Create data and log directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_user }}"
    mode: "0750"
  loop:
    - "{{ opensearch_data_path }}"
    - "{{ opensearch_logs_path }}"

- name: Render opensearch.yml
  ansible.builtin.template:
    src: opensearch.yml.j2
    dest: "{{ opensearch_conf_dir }}/opensearch.yml"
    owner: root
    group: "{{ opensearch_user }}"
    mode: "0640"
  notify: Restart OpenSearch

- name: Configure JVM heap size
  ansible.builtin.template:
    src: heap.options.j2
    dest: "{{ opensearch_conf_dir }}/jvm.options.d/heap.options"
    owner: root
    group: "{{ opensearch_user }}"
    mode: "0640"
  notify: Restart OpenSearch

- name: Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/opensearch.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure service limits via systemd override
  ansible.builtin.template:
    src: opensearch-override.conf.j2
    dest: /etc/systemd/system/opensearch.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart OpenSearch

- name: Enable and start OpenSearch
  ansible.builtin.systemd_service:
    name: opensearch
    enabled: true
    state: started
    daemon_reload: true
  # если сервис только что запущен, handler перезапуска не нужен
  register: opensearch_service_start
