---
- name: Configure kernel parameters
  ansible.builtin.template:
    src: sysctl-opensearch.conf.j2
    dest: /etc/sysctl.d/90-opensearch.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when:
    - opensearch_disable_swap
    - ansible_facts['swaptotal_mb'] | int > 0
  changed_when: true

- name: Disable swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\s]+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'
  when: opensearch_disable_swap

# vm.max_map_count нужен до первого старта OpenSearch, поэтому handler
# с sysctl выполняем сразу, а не в конце play.
- name: Apply system settings before service install
  ansible.builtin.meta: flush_handlers
