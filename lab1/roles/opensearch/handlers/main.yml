---
- name: Обновить кэш apt
  ansible.builtin.apt:
    update_cache: true

- name: Применить sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Перечитать конфигурацию systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Если сервис только что запущен этим же прогоном, он уже читает новую
# конфигурацию, и второй перезапуск ничего не даёт.
- name: Перезапустить OpenSearch
  ansible.builtin.systemd_service:
    name: opensearch
    state: restarted
  when: opensearch_service_start is not changed

- name: Перезапустить OpenSearch Dashboards
  ansible.builtin.systemd_service:
    name: opensearch-dashboards
    state: restarted
  when: opensearch_dashboards_service_start is not changed
