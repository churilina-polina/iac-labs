---
# Прогон роли + дополнительные проверки. Пароль берётся из окружения OPENSEARCH_ADMIN_PASSWORD.
#   с управляющей машины (из lab1/): ansible-playbook -i inventory/hosts.yml roles/opensearch/tests/test.yml
#   на самой целевой машине:         ansible-playbook -i tests/inventory tests/test.yml
- name: Test opensearch role
  hosts: all
  become: true
  vars:
    opensearch_admin_password: "{{ lookup('ansible.builtin.env', 'OPENSEARCH_ADMIN_PASSWORD') }}"
  roles:
    - role: opensearch

  post_tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert services are enabled and running
      ansible.builtin.assert:
        that:
          - ansible_facts['services'][item]['status'] == 'enabled'
          - ansible_facts['services'][item]['state'] == 'running'
        quiet: true
      loop:
        - opensearch.service
        - opensearch-dashboards.service

    - name: Assert packages are held
      ansible.builtin.command: apt-mark showhold
      register: opensearch_test_held
      changed_when: false
      failed_when: >-
        'opensearch' not in opensearch_test_held.stdout_lines
        or 'opensearch-dashboards' not in opensearch_test_held.stdout_lines
