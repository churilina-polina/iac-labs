---
# Локальная VM в Lima (lima-vm.yaml). Порт SSH меняется при каждом старте VM,
# поэтому подключаемся через ssh-конфиг, который Lima генерирует сама.
all:
  children:
    opensearch:
      hosts:
        opensearch-lab:
          ansible_host: lima-opensearch-lab
          ansible_ssh_common_args: "-F {{ lookup('ansible.builtin.env', 'HOME') }}/.lima/opensearch-lab/ssh.config"
